services:
  oracle:
    image: container-registry.oracle.com/database/free:latest
    environment:
      ORACLE_PWD: ${ORACLE_PASSWORD:?Define ORACLE_PASSWORD in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:1523:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./docker/oracle/01_create_user.sh:/opt/oracle/scripts/startup/01_create_user.sh:ro

  backend:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: container
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USERNAME: AGRODB
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      oracle:
        condition: service_healthy

volumes:
  oracle_data:
